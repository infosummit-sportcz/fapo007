<style>
:root{
  color-scheme: light;
  --bg:#E7EDF0; --panel:#FFFFFF; --ink:#12303F; --ink-soft:#4F6875;
  --line:#C5D2D9; --line-soft:#DCE5EA; --accent:#0A5D8F; --qty:#E1EAEF;
  --warn:#9A5B00; --mark:#FFD666; --mark-ink:#12303F;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1A21; --panel:#15252E; --ink:#E7F0F4; --ink-soft:#9DB2BD;
    --line:#2C4350; --line-soft:#223641; --accent:#6CC0EE; --qty:#21363F; --warn:#F0B45A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1A21; --panel:#15252E; --ink:#E7F0F4; --ink-soft:#9DB2BD;
  --line:#2C4350; --line-soft:#223641; --accent:#6CC0EE; --qty:#21363F; --warn:#F0B45A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

.app{max-width:980px;margin:0 auto;padding:0 16px 48px}

/* Záhlaví */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:22px 0 14px}
.top h1{margin:0;font-size:clamp(1.9rem,6vw,2.6rem);font-weight:800;font-stretch:125%;letter-spacing:-.01em;line-height:1}
.top .sub{margin:6px 0 0;color:var(--ink-soft);font-size:.95rem}
.top .source{margin:2px 0 0;color:var(--ink-soft);font-size:.85rem;overflow-wrap:anywhere}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.title-row{display:flex;align-items:center;gap:12px}
.brand-logo{height:44px;width:auto;flex:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-logo{filter:invert(1) brightness(1.15)} }
:root[data-theme="dark"] .brand-logo{filter:invert(1) brightness(1.15)}
.btn{padding:9px 14px;border:1.5px solid var(--ink);background:transparent;border-radius:9px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--panel)}
.btn.quiet{border-color:var(--line)}
.notice{margin:0 0 10px;padding:10px 14px;border-radius:9px;background:var(--panel);border:1.5px solid var(--accent);font-size:.95rem}
.notice.error{border-color:var(--warn);color:var(--warn)}
.notice[hidden]{display:none}

/* Vyhledávání */
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.fields{display:grid;grid-template-columns:1fr 8.5rem;gap:12px}
@media (min-width:560px){.fields{grid-template-columns:1fr 13rem}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.9rem;font-weight:600;color:var(--ink-soft)}
.field input{width:100%;height:54px;padding:0 14px;font:inherit;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px}
.field input::placeholder{font-size:.95rem;font-weight:400;color:var(--ink-soft);opacity:.85}
.field input:focus{border-color:var(--accent)}
.field .input-wrap{position:relative;display:flex}
.field.has-scan input{padding-right:52px}
.scanbtn{position:absolute;right:6px;top:6px;bottom:6px;width:42px;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:7px;background:var(--ink);color:var(--panel);cursor:pointer;padding:0}
.scanbtn svg{width:22px;height:22px}
.scanbtn[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.scanbtn{transition:background-color .12s}}
.scanbtn:hover{background:var(--accent)}

/* Skenování čárového kódu */
.scanner{position:fixed;inset:0;z-index:50;background:#0A1216;display:flex;flex-direction:column}
.scanner[hidden]{display:none}
.scanner-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px}
.scanner-label{color:#EAF2F6;font-weight:650;font-size:1.05rem}
.scanner-actions{display:flex;gap:8px}
.scanner-iconbtn{width:44px;height:44px;border-radius:9px;border:1.5px solid rgba(234,242,246,.35);background:transparent;color:#EAF2F6;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.scanner-iconbtn[aria-pressed="true"]{background:#EAF2F6;color:#0A1216;border-color:#EAF2F6}
.scanner-iconbtn[hidden]{display:none}
.scanner-iconbtn svg{width:22px;height:22px}
.scanner-view{flex:1;min-height:0;position:relative;overflow:hidden}
.scanner-view video{width:100%;height:100%;object-fit:cover}
.scanner-msg{margin:0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;color:#EAF2F6;font-size:.98rem;min-height:1.4em}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:5px 10px;border:1.5px solid var(--line);background:var(--panel);border-radius:7px;font-weight:600;font-size:.95rem;cursor:pointer}
.chip span{margin-left:6px;font-weight:500;font-size:.82rem;color:var(--ink-soft)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.8}
.chip.more{border-style:dashed;background:transparent;color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:12px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.linkbtn{padding:2px 0;background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn[hidden]{display:none}

/* Výsledky */
.status{margin:16px 0 10px;font-size:1rem;min-height:1.4em}
.status .hint{display:block;margin-top:4px;color:var(--ink-soft);font-size:.92rem}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:9.5rem 1fr auto;grid-template-areas:"code info price";gap:6px 18px;padding:16px 18px;border-top:1px solid var(--line-soft)}
.item:first-child{border-top:0}
.code{grid-area:code;font-size:1.25rem;font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:.01em;overflow-wrap:anywhere}
.info{grid-area:info;min-width:0}
.price{grid-area:price;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.price .amount{font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.price-link{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-decoration:none;color:inherit}
.thumb{width:84px;height:84px;border-radius:9px;object-fit:cover;background:var(--qty);border:1px solid var(--line-soft)}
.thumb[hidden]{display:none}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
.name{margin:0 0 2px;font-size:1.05rem;font-weight:650;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;margin:0 0 11px;color:var(--ink-soft);font-size:.9rem}
.meta .brand{color:var(--ink);font-weight:600}
.sizes{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;border:1.5px solid var(--ink);border-radius:7px;overflow:hidden;font-variant-numeric:tabular-nums}
.tag-size{padding:5px 9px;font-weight:700;font-size:.98rem}
.tag-qty{padding:5px 9px;background:var(--qty);border-left:1.5px solid var(--ink);font-size:.88rem;font-weight:600}
.tag.is-match .tag-size{background:var(--ink);color:var(--panel)}
.tag.is-dim{opacity:.5}
.tag.is-zero{border-style:dashed;border-color:var(--ink-soft);color:var(--ink-soft)}
.tag.is-zero .tag-qty{background:transparent;border-left:1.5px dashed var(--ink-soft)}
.tag.is-neg .tag-qty{color:var(--warn)}
details.codes{margin-top:10px}
details.codes summary{width:fit-content;cursor:pointer;color:var(--accent);font-size:.88rem;font-weight:600}
details.codes dl{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:8px 0 0;font-size:.9rem;font-variant-numeric:tabular-nums}
details.codes dt{color:var(--ink-soft)}
details.codes dd{margin:0;overflow-wrap:anywhere}
.empty{padding:26px 22px;background:var(--panel);border:1px dashed var(--line);border-radius:12px;color:var(--ink-soft)}
.empty h2{margin:0 0 6px;font-size:1.1rem;color:var(--ink)}
.empty p{margin:0 0 6px;max-width:60ch}
.morewrap{display:flex;justify-content:center;margin-top:16px}
.morewrap[hidden]{display:none}

@media (max-width:640px){
  .item{grid-template-columns:1fr auto;grid-template-areas:"code price" "info info";padding:14px}
  .thumb{width:64px;height:64px}
  .brand-logo{height:32px}
}
@media (prefers-reduced-motion:no-preference){
  .chip,.btn{transition:background-color .12s,color .12s,border-color .12s}
}
</style>
</head>

  const A = sizeSortKey(a), B = sizeSortKey(b);
  for(let i=0;i<3;i++){
    if(A[i]===B[i]) continue;
    return typeof A[i]==='number' && typeof B[i]==='number' ? A[i]-B[i] : String(A[i]).localeCompare(String(B[i]),'cs');
  }
  return 0;
}

/* ---------- data ---------- */
function build(rows){
  const map = new Map();
  for(const r of rows){
    const key = r.c+'|'+r.col;
    let p = map.get(key);
    if(!p){
      p = {key,c:r.c,cn:r.c.replace(/^0+/,''),n:r.n,col:r.col,b:r.b,s:r.s,t:r.t,g:r.g,grp:r.grp||'',p:r.p,d:new Set(),sizes:[]};
      map.set(key,p);
    }
    if(r.d) p.d.add(r.d);
    const ns = normSize(r.sz);
    const s = p.sizes.find(x=>x.n===ns);
    if(s){ s.q += r.q; if(r.e && !s.e.includes(r.e)) s.e.push(r.e); }
    else p.sizes.push({l:r.sz||'',n:ns,q:r.q,e:r.e?[r.e]:[]});
  }
  const arr = [...map.values()];
  for(const p of arr){
    p.sizes.sort((a,b)=>cmpSize(a.n,b.n));
    p.lc = p.c.toLowerCase(); p.lcn = p.cn.toLowerCase(); p.ln = p.n.toLowerCase();
    p.ltags = [p.n,p.b,p.t,p.grp,p.g].filter(Boolean).join(' ').toLowerCase();
    p.ld = [...p.d].map(x=>x.toLowerCase());
    p.le = p.sizes.flatMap(s=>s.e);
  }
  arr.sort((a,b)=>a.c.localeCompare(b.c)||a.col.localeCompare(b.col,'cs'));
  return arr;
}
function codeRank(p,q,nameWords){
  const hasName = !!(nameWords && nameWords.length);
  if(!q && !hasName) return 0;
  if(q){
    if(p.lc===q || p.lcn===q) return 0;
    if(p.lc.startsWith(q) || (p.lcn && p.lcn.startsWith(q))) return 1;
    if(p.lc.includes(q)) return 2;
    if(q.length>=3 && p.ld.some(d=>d.includes(q))) return 3;
    if(q.length>=6 && p.le.some(e=>e.includes(q))) return 3;
  }
  if(hasName && nameWords.every(w=>p.ltags.includes(w))) return 4;
  return -1;
}
function highlightAll(text,needles){
  text = String(text||'');
  if(!needles || !needles.length) return esc(text);
  const lower = text.toLowerCase();
  let ranges = [];
  for(const w of needles){
    if(!w) continue;
    let idx = 0;
    while(true){
      const i = lower.indexOf(w,idx);
      if(i<0) break;
      ranges.push([i,i+w.length]);
      idx = i+w.length;
    }
  }
  if(!ranges.length) return esc(text);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [ranges[0]];
  for(let i=1;i<ranges.length;i++){
    const r = ranges[i], last = merged[merged.length-1];
    if(r[0]<=last[1]) last[1] = Math.max(last[1],r[1]); else merged.push(r.slice());
  }
  let out = '', pos = 0;
  for(const [s,e] of merged){ out += esc(text.slice(pos,s))+'<mark>'+esc(text.slice(s,e))+'</mark>'; pos = e; }
  out += esc(text.slice(pos));
  return out;
}

// Čtení aktuálních dat funguje na všech zařízeních bez přihlášení (gist, i jako
// "secret", je čitelný komukoli, kdo zná jeho ID — jen není ve veřejném výpisu).
// Nahrání nového souboru vyžaduje GitHub token s právem "gist" (návod: viz chat) —
// zadá se jen jednou na každém zařízení, ze kterého se bude nahrávat, a uloží se
// v tomto prohlížeči (localStorage), nikde jinde se neodesílá.
const GIST_ID = '162631c36ed59f9e008a343b9a60ac72';
const GIST_FILENAME = 'fapo007-sklad.json';
const GH_TOKEN_KEY = 'fapo007:ghtoken:v1';
const SHARED_ENABLED = !!(GIST_ID && GIST_ID.indexOf('VLOZTE_SEM')!==0);
function ghToken(){ try{ return localStorage.getItem(GH_TOKEN_KEY)||''; }catch(e){ return ''; } }
function localFallbackInit(){
  let src = {date:EMBED.date,file:EMBED.file,rows:EMBED.rows,custom:false,shared:false};
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.rows) && s.rows.length && s.date >= EMBED.date) src = {date:s.date,file:s.file,rows:s.rows,custom:true,shared:false};
    }
  }catch(e){}
  setData(src);
}
async function loadShared(){
  try{
    const r = await fetch('https://api.github.com/gists/'+GIST_ID,{headers:{Accept:'application/vnd.github+json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    const file = data.files && data.files[GIST_FILENAME];
    if(!file){ setData({date:EMBED.date,file:EMBED.file,rows:EMBED.rows,custom:false,shared:true}); return; }
    let text = file.content;
    if(file.truncated || text==null){ const rr = await fetch(file.raw_url); text = await rr.text(); }
    let d = null; try{ d = JSON.parse(text||'{}'); }catch(e){}
    if(d && Array.isArray(d.rows) && d.rows.length) setData({date:d.date,file:d.file,rows:d.rows,custom:true,shared:true});
    else setData({date:EMBED.date,file:EMBED.file,rows:EMBED.rows,custom:false,shared:true});
  }catch(err){
    showNotice('Sdílená data se nepodařilo načíst (zkontrolujte připojení k internetu), zobrazuji data uložená v tomto prohlížeči.',true);
    localFallbackInit();
  }
}
async function writeShared(date,file,rows){
  let token = ghToken();
  if(!token){
    token = (prompt('Pro nahrání nového souboru zadejte GitHub token (vygenerovaný v github.com/settings/tokens, s právem "gist"). Zadává se jen jednou na tomto zařízení a uloží se jen v tomto prohlížeči.')||'').trim();
    if(!token){ const e = new Error('no token'); e.code = 'no_token'; throw e; }
    try{ localStorage.setItem(GH_TOKEN_KEY,token); }catch(e){}
  }
  const r = await fetch('https://api.github.com/gists/'+GIST_ID,{
    method:'PATCH',
    headers:{Accept:'application/vnd.github+json','Authorization':'token '+token,'Content-Type':'application/json'},
    body:JSON.stringify({files:{[GIST_FILENAME]:{content:JSON.stringify({date,file,rows})}}})
  });
  if(!r.ok){
    if(r.status===401){ try{ localStorage.removeItem(GH_TOKEN_KEY); }catch(e){} }
    const e = new Error('HTTP '+r.status); e.code = r.status===401?'auth':'http'; throw e;
  }
}

  if(!SHARED_ENABLED){ localFallbackInit(); return; }
  await loadShared();
}

/* ---------- nahrání nového souboru ---------- */
function showNotice(msg,isError){ el.notice.textContent = msg; el.notice.className = 'notice'+(isError?' error':''); el.notice.hidden = !msg; }
const str = v => String(v==null?'':v).trim();
const num = v => { if(typeof v==='number') return v; const n = parseFloat(str(v).replace(/\s/g,'').replace(',','.')); return isNaN(n)?0:n; };
const codeOf = v => { const s = str(v); return /^\d+$/.test(s) && s.length<7 ? s.padStart(7,'0') : s; };
function parseSheet(raw){
  if(!raw.length) throw new Error('Soubor neobsahuje žádné řádky.');
  const keys = Object.keys(raw[0]);
  const K = {}; const need = {c:'Kód zboží',q:'Stav',sz:'Velikost',n:'Název',col:'Barva',p:'PC s DPH',b:'Značka / výrobce',s:'Název sezóny',t:'Téma',g:'Pods.',grp:'Skup.',d:'Dod. označení',e:'EAN',sklad:'Sklad'};
  for(const k in need) K[k] = keys.find(x=>x.trim()===need[k]);
  const missing = ['c','q','sz','n'].filter(k=>!K[k]).map(k=>need[k]);
  if(missing.length) throw new Error('V souboru chybí sloupce: '+missing.join(', ')+'. Nahrajte export skladu ve stejném formátu jako původní soubor.');
  let rows = raw.map(r=>({sklad:str(r[K.sklad]),c:codeOf(r[K.c]),n:str(r[K.n]),col:str(r[K.col]),sz:str(r[K.sz]),q:num(r[K.q]),p:num(r[K.p]),
    b:str(r[K.b]),s:str(r[K.s]),t:str(r[K.t]),g:str(r[K.g]),grp:K.grp?str(r[K.grp]):'',d:str(r[K.d]),e:str(r[K.e])})).filter(r=>r.c);
  if(rows.some(r=>r.sklad==='007')) rows = rows.filter(r=>r.sklad==='007');
  rows.forEach(r=>delete r.sklad);
  if(!rows.length) throw new Error('V souboru nejsou žádné položky skladu 007.');
  return rows;
}
async function publish(date,file,rows,successMsg){
  if(SHARED_ENABLED){
    try{
      await writeShared(date,file,rows);
      showNotice(successMsg+' Data se teď sdílí na všech zařízeních, kde tuto aplikaci otevřete.',false);
      return;
    }catch(err){
      const msg = err && err.code==='no_token'
        ? 'Nahrávání bylo zrušeno (chybí token), data zůstanou jen v tomto prohlížeči.'
        : err && err.code==='auth'
        ? 'GitHub token není platný nebo byl odvolán. Zkuste to znovu — aplikace o něj znovu požádá.'
        : 'Sdílené uložení se nepodařilo (zkontrolujte připojení k internetu), data zůstanou jen v tomto prohlížeči.';
      showNotice(msg,true);
      // pokračuje lokálním záložním uložením níže
    }
  }
  let saved = true;
  try{ localStorage.setItem(LS_KEY,JSON.stringify({date,file,rows})); }catch(err){ saved = false; }
  setData({date,file,rows,custom:true,shared:false});
  if(!SHARED_ENABLED) showNotice(successMsg+(saved?' Data zůstanou uložená jen v tomto prohlížeči.':' Data se nepodařilo uložit, po zavření stránky se ztratí.'),false);
}

/* ---------- skenování čárového kódu ---------- */
const SCAN_FORMATS = [9,10,14,15,5,3,8]; // EAN_13, EAN_8, UPC_A, UPC_E, CODE_128, CODE_39, ITF
let scanner = null, scanCameras = [], scanCamIdx = 0, scanTorchOn = false, scanStarting = false;
const hasCameraApi = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function qrboxFn(vw,vh){
  const w = Math.round(Math.min(vw*0.66, Math.max(vh,vw)*0.7));
  const h = Math.max(56,Math.round(Math.min(vh*0.16, w*0.24)));
  return {width:Math.max(180,w),height:h};
}
function scanErrorMsg(err){
  const s = String((err && (err.message||err))||'');
  if(/NotAllowedError|Permission denied|dismissed/i.test(s)) return 'Přístup ke kameře byl zamítnut. Povolte kameru v nastavení prohlížeče a zkuste to znovu.';
  if(/NotFoundError/i.test(s)) return 'Na tomto zařízení nebyla nalezena žádná kamera.';
  if(/NotReadableError/i.test(s)) return 'Kameru se nepodařilo spustit, protože ji používá jiná aplikace.';
  return 'Kameru se nepodařilo spustit. Kód můžete zadat i ručně.';
}
async function startScanner(){
  if(scanStarting) return;
  scanStarting = true;
  el.scanner.hidden = false;
  el.scannerTorch.hidden = true; el.scannerSwitch.hidden = true;
  el.scannerMsg.textContent = 'Spouštím kameru…';
  try{
    if(!window.Html5Qrcode) throw new Error('Knihovna pro skenování se nenačetla. Zkontrolujte připojení k internetu.');
    if(!scanner) scanner = new Html5Qrcode('scannerView',{formatsToSupport:SCAN_FORMATS,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    // Dokud neznáme seznam kamer (popisky kamer bývají před udělením oprávnění
    // nespolehlivé/prázdné), žádáme rovnou o zadní kameru přes facingMode –
    // to funguje spolehlivě i bez enumerace zařízení.
    const target = scanCameras.length ? {deviceId:{exact:scanCameras[scanCamIdx % scanCameras.length].id}} : {facingMode:{ideal:'environment'}};
    const videoConstraints = Object.assign({width:{ideal:1920},height:{ideal:1080},advanced:[{focusMode:'continuous'}]},target);
    try{
      await scanner.start(target,{fps:10,qrbox:qrboxFn,videoConstraints},onScanSuccess,()=>{});
    }catch(e){
      // Vysoké rozlišení nemusí zařízení podporovat – zkusit bez explicitních video constraints.
      await scanner.start(target,{fps:10,qrbox:qrboxFn},onScanSuccess,()=>{});
    }
    // Teď, když kamera běží (oprávnění je udělené), zjistíme seznam kamer pro
    // tlačítko přepínání a seřadíme scanCamIdx podle té, která je skutečně aktivní.
    if(!scanCameras.length){
      try{
        scanCameras = await Html5Qrcode.getCameras()||[];
        if(scanCameras.length){
          let curId = '';
          try{ curId = (scanner.getRunningTrackSettings()||{}).deviceId||''; }catch(e){}
          let idx = curId ? scanCameras.findIndex(c=>c.id===curId) : -1;
          if(idx<0) idx = scanCameras.findIndex(c=>/back|rear|environment|world/i.test(c.label||''));
          scanCamIdx = idx>=0 ? idx : 0;
        }
      }catch(e){}
    }
    el.scannerMsg.textContent = 'Namiřte kameru na čárový kód (cca 10–15 cm od kódu, zarovnejte rovně)';
    el.scannerSwitch.hidden = scanCameras.length<2;
    try{ const caps = scanner.getRunningTrackCapabilities(); el.scannerTorch.hidden = !(caps && caps.torch); }
    catch(e){ el.scannerTorch.hidden = true; }
  }catch(err){
    el.scannerMsg.textContent = scanErrorMsg(err);
  }finally{
    scanStarting = false;
  }
}
async function stopScanner(){
  el.scanner.hidden = true;
  scanTorchOn = false; el.scannerTorch.setAttribute('aria-pressed','false');
  if(scanner){
    try{ if(scanner.isScanning) await scanner.stop(); }catch(e){}
    try{ scanner.clear(); }catch(e){}
  }
}
function onScanSuccess(text){
  el.q.value = String(text||'').trim();
  stopScanner();
  limit = PAGE; showNotice('',false); render(); el.q.focus();
}
window.addEventListener('load',()=>{ if(!hasCameraApi()) el.scan.hidden = true; });

el.scannerClose.addEventListener('click',stopScanner);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !el.scanner.hidden) stopScanner(); });
el.scannerSwitch.addEventListener('click',async ()=>{
  if(scanCameras.length<2) return;
  scanCamIdx = (scanCamIdx+1)%scanCameras.length;

  await startScanner();
});

  catch(e){}
});

/* ---------- filtrování ---------- */
function getFacets(q,showZero,nameWords){
  const ck = q+'|'+(nameWords?nameWords.join(' '):'')+'|'+showZero+'|'+dbVersion;
  if(facetCache.key===ck) return facetCache.list;
  const cand = products.filter(p=>codeRank(p,q,nameWords)>=0);
  const keys = new Map();
  for(const p of cand) for(const s of p.sizes){
    if(!s.n || !(showZero||s.q>0)) continue;
    if(!keys.has(s.n)) keys.set(s.n,s.l);
  }
  const list = [];
  for(const [k,label] of keys){
    let count = 0;
    for(const p of cand) if(p.sizes.some(s=>s.n && (showZero||s.q>0) && sizeMatches(s.n,k))) count++;
    list.push({key:k,label,count});
  }
  list.sort((a,b)=>cmpSize(a.key,b.key));
  facetCache = {key:ck,list};
  return list;
}
/* Fotka produktu z e-shopu summit-sport.cz (dle kódu zboží), natažená přímo —
   mimo claude.ai žádné omezení na cizí domény není. Pro kód bez fotky vrací
   e-shop 1×1px zástupný obrázek; to se pozná podle naturalWidth<=2 po načtení
   (viz posluchač load/error u #results níže) a náhled se pak schová.
*/
function thumbUrl(code){
  return 'https://www.summit-sport.cz/i/?i='+encodeURIComponent(code)+'_1.jpg&w=168&h=168';
}
function eshopUrl(code){
  return 'https://www.summit-sport.cz/hledani/'+encodeURIComponent(code)+'/';
}
function markCode(p,q){
  if(q){
    const i = p.lc.indexOf(q);
    if(i>=0) return esc(p.c.slice(0,i))+'<mark>'+esc(p.c.slice(i,i+q.length))+'</mark>'+esc(p.c.slice(i+q.length));
  }
  return esc(p.c);
}
function itemHtml(p,q,sq,showZero,nameWords){
  const hl = (t) => nameWords && nameWords.length ? highlightAll(t,nameWords) : esc(t);
  const meta = [];
  if(p.b) meta.push('<span class="brand">'+hl(p.b)+'</span>');
  if(p.col) meta.push('<span>'+esc(p.col)+'</span>');
  if(p.s) meta.push('<span>'+esc(p.s)+'</span>');
  const kind = [p.t&&sentence(p.t),p.grp&&p.grp.toLowerCase(),p.g&&p.g.toLowerCase()].filter(Boolean).join(', ');
  if(kind) meta.push('<span>'+hl(kind)+'</span>');
  const rows = p.sizes.filter(s=>showZero||s.q>0);
  const tags = rows.map(s=>{
    const match = sq && sizeMatches(s.n,sq);
    const cls = ['tag']; if(match) cls.push('is-match'); if(sq && !match) cls.push('is-dim'); if(s.q<=0) cls.push('is-zero'); if(s.q<0) cls.push('is-neg');
    const label = s.l || 'bez velikosti';
    const qty = (s.q<0?'−'+nf.format(-s.q):nf.format(s.q))+' ks';
    return '<li class="'+cls.join(' ')+'" title="'+esc(label)+': '+qty+'"><span class="tag-size">'+esc(label)+'</span><span class="tag-qty">'+qty+'</span></li>';
  }).join('');
  const dl = [];
  if(p.d.size) dl.push('<dt>Kód dodavatele</dt><dd>'+esc([...p.d].join(', '))+'</dd>');
  for(const s of p.sizes) if(s.e.length) dl.push('<dt>EAN '+esc(s.l||'bez velikosti')+'</dt><dd>'+esc(s.e.join(', '))+'</dd>');
  const details = dl.length ? '<details class="codes"><summary>EAN a kód dodavatele</summary><dl>'+dl.join('')+'</dl></details>' : '';
  const nameHtml = nameWords && nameWords.length ? highlightAll(p.n,nameWords) : esc(p.n);
  return '<article class="item"><div class="code">'+markCode(p,q)+'</div><div class="info"><h2 class="name">'+nameHtml+'</h2>'+
    '<p class="meta">'+meta.join('')+'</p><ul class="sizes">'+tags+'</ul>'+details+'</div>'+
    '<div class="price"><a class="price-link" href="'+esc(eshopUrl(p.c))+'" target="_blank" rel="noopener" title="Otevřít na eshopu summit-sport.cz"><span class="amount">'+(p.p>0?nf.format(p.p)+'\u00A0Kč':'')+'</span>'+
    '<img class="thumb" src="'+esc(thumbUrl(p.c))+'" alt="" loading="lazy" decoding="async"></a></div></article>';
}
function renderChips(facets,sq){
  const top = new Set([...facets].sort((a,b)=>b.count-a.count).slice(0,CHIPS_COLLAPSED).map(f=>f.key));
  const shown = facets.filter(f=>chipsOpen || top.has(f.key) || f.key===sq);
  let html = shown.map(f=>'<button type="button" class="chip" data-size="'+esc(f.label)+'" aria-pressed="'+(f.key===sq)+'">'+esc(f.label)+'<span>'+f.count+'</span></button>').join('');
  if(facets.length>CHIPS_COLLAPSED) html += '<button type="button" class="chip more" data-act="chips">'+(chipsOpen?'Méně velikostí':'Všechny velikosti ('+facets.length+')')+'</button>';
  el.chips.innerHTML = html;
}
function render(){
  const qRaw = el.q.value.trim().toLowerCase().replace(/\s+/g,' ');
  const q = qRaw.replace(/\s+/g,'');
  const nameWords = qRaw ? qRaw.split(' ').filter(Boolean) : [];
  const rawSize = el.sz.value.trim();
  const sq = normSize(rawSize);
  const showZero = el.zero.checked;
  const active = !!(q||sq);
  el.clear.hidden = !(active || showZero);

  const facets = getFacets(q,showZero,nameWords);
  renderChips(facets,sq);

  if(!active){
    let inStock = 0, pieces = 0;
    for(const p of products){ let has=false; for(const s of p.sizes) if(s.q>0){pieces+=s.q;has=true;} if(has) inStock++; }
    el.status.innerHTML = '';
    el.results.innerHTML = '<div class="empty"><h2>Co hledáte?</h2><p>Zadejte kód zboží (stačí jeho část), EAN, kód dodavatele nebo část názvu zboží. Můžete přidat velikost, nebo rovnou vybrat některou z velikostí výše.</p><p>Ve skladu je '+
      nf.format(inStock)+' '+pl(inStock,'produkt','produkty','produktů')+', celkem '+nf.format(pieces)+' ks.</p></div>';
    el.morewrap.hidden = true; return;
  }

  const matched = []; let hidden = 0;
  for(const p of products){
    const rank = codeRank(p,q,nameWords); if(rank<0) continue;
    const hit = s => !sq || sizeMatches(s.n,sq);
    if(!p.sizes.some(hit)) continue;
    if(!p.sizes.some(s=>hit(s) && (showZero||s.q>0))){ hidden++; continue; }
    matched.push({p,rank});
  }
  matched.sort((a,b)=>a.rank-b.rank);

  if(!matched.length){
    let html = '<strong>Nic nenalezeno.</strong>';
    if(hidden){
      html = '<strong>'+hidden+' '+pl(hidden,'produkt odpovídá','produkty odpovídají','produktů odpovídá')+', ale '+(hidden===1?'není':'nejsou')+' skladem.</strong> <button type="button" class="linkbtn" data-act="showzero">Zobrazit i položky bez zásoby</button>';
    }else{
      html += '<span class="hint">Zkuste kratší část kódu nebo názvu'+(sq?' nebo jinou velikost, nabídka velikostí je výše':'')+'.</span>';
    }
    el.status.innerHTML = html; el.results.innerHTML = ''; el.morewrap.hidden = true; return;
  }

  let qty = 0;
  for(const {p} of matched) for(const s of p.sizes) if(s.q>0 && (!sq || sizeMatches(s.n,sq))) qty += s.q;
  const n = matched.length;
  el.status.innerHTML = '<strong>'+nf.format(n)+' '+pl(n,'produkt','produkty','produktů')+'</strong>, '+nf.format(qty)+' ks '+(sq?'ve velikosti '+esc(rawSize.toUpperCase()):'skladem')+
    (hidden && !showZero ? '<span class="hint">'+pl(hidden,'Další ','Další ','Dalších ')+hidden+' '+pl(hidden,'produkt je','produkty jsou','produktů je')+' bez zásoby. <button type="button" class="linkbtn" data-act="showzero">Zobrazit</button></span>' : '');
  el.results.innerHTML = '<div class="list">'+matched.slice(0,limit).map(({p})=>itemHtml(p,q,sq,showZero,nameWords)).join('')+'</div>';
  const rest = n-limit;
  el.morewrap.hidden = rest<=0;
  if(rest>0) el.more.textContent = 'Zobrazit dalších '+Math.min(PAGE,rest)+' (zbývá '+rest+')';
}

/* ---------- události ---------- */
const onType = () => { limit = PAGE; showNotice('',false); render(); };
el.q.addEventListener('input',onType);
el.sz.addEventListener('input',onType);
el.zero.addEventListener('change',()=>{ limit = PAGE; render(); });
[el.q,el.sz].forEach(i=>{
  i.addEventListener('focus',()=>i.select());
  i.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); i.select(); } });
});
el.clear.addEventListener('click',()=>{ el.q.value=''; el.sz.value=''; el.zero.checked=false; limit=PAGE; render(); el.q.focus(); });
el.more.addEventListener('click',()=>{ limit += PAGE; render(); });
el.chips.addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.act==='chips'){ chipsOpen = !chipsOpen; render(); return; }
  const label = b.dataset.size;
  el.sz.value = normSize(el.sz.value)===normSize(label) ? '' : label;
  limit = PAGE; render();
});
el.status.addEventListener('click',e=>{
  const b = e.target.closest('[data-act="showzero"]'); if(!b) return;
  el.zero.checked = true; limit = PAGE; render();
});
/* fotky z e-shopu: placeholder (1x1 px) nebo chyba sítě -> skrýt, aby nezůstal prázdný rámeček */
el.results.addEventListener('error',e=>{
  const img = e.target;
  if(img && img.classList && img.classList.contains('thumb')) img.hidden = true;
},true);
el.results.addEventListener('load',e=>{
  const img = e.target;
  if(img && img.classList && img.classList.contains('thumb') && img.naturalWidth<=2) img.hidden = true;
},true);

init();
})();
</script>
